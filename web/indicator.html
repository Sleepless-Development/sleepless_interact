<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <style>
        :root {
            --indicator-fit: 3.5;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        body {
            display: grid;
            place-items: center;
        }

        .indicator-fit {
            transform: scale(var(--indicator-fit));
            transform-origin: center;
        }

        .loader {
            margin: 0 !important;
        }

        @media (prefers-reduced-motion: reduce) {
            .loader,
            .loader::before,
            .loader::after {
                animation: none !important;
            }
        }
    </style>
    <link id="indicator-style" rel="stylesheet" href="" />
</head>
<body>
    <div class="indicator-fit">
        <span class="loader"></span>
    </div>
    <script>
        const params = new URLSearchParams(location.search);
        const style = (params.get("style") || "").replace(/[^a-z0-9_-]/gi, "");
        const color1 = params.get("color1");
        const color2 = params.get("color2") || params.get("accent");
        const override = params.get("override") === "1";
        const loader = document.querySelector(".loader");

        function cssColor(value, fallback) {
            if (!value) return fallback;
            const parts = value.split(",");
            if (parts.length < 3) return fallback;
            if (parts.length >= 4) {
                return "rgba(" + parts[0] + "," + parts[1] + "," + parts[2] + "," + parts[3] + ")";
            }
            return "rgb(" + parts[0] + "," + parts[1] + "," + parts[2] + ")";
        }

        if (style) {
            document.getElementById("indicator-style").href = "indicators/" + style + ".css";
        }

        if (params.has("preview")) {
            document.documentElement.style.background = "#111";
        }

        if (loader && (style !== "wedge" || override)) {
            loader.style.setProperty("--color-1", cssColor(color1, "#fff"));
            const second = cssColor(color2, "");
            if (second) loader.style.setProperty("--color-2", second);
        }
    </script>
</body>
</html>
