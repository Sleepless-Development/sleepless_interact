<!DOCTYPE html>
<html lang="en" data-theme="modern">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sleepless_interact</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" />
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="themes/legacy.css" rel="stylesheet" type="text/css" />
    <link href="themes/modern.css" rel="stylesheet" type="text/css" />
    <link href="themes/minimal.css" rel="stylesheet" type="text/css" />
    <link href="themes/light.css" rel="stylesheet" type="text/css" />
    <link href="themes/retro.css" rel="stylesheet" type="text/css" />
    <link href="themes/cyber.css" rel="stylesheet" type="text/css" />
    <link href="themes/vice.css" rel="stylesheet" type="text/css" />
    <link href="themes/noir.css" rel="stylesheet" type="text/css" />
    <link href="themes/industrial.css" rel="stylesheet" type="text/css" />
    <link href="themes/fantasy.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div class="browser-dock" id="browser-dock" hidden>
      <span class="browser-dock-label">Theme</span>
      <div class="browser-themes" id="browser-themes"></div>
      <button type="button" id="browser-compact">Compact</button>
      <button type="button" id="browser-cooldown">Cooldown</button>
    </div>

    <div id="container">
      <div id="interact-container">
        <div id="interact-progress"></div>
        <div id="interact-key">E</div>
      </div>

      <div id="options-wrapper">
        <div id="interact-summary" class="interact-summary">
          <div class="animated-background"></div>
          <p class="option-label">Interact</p>
        </div>
        <div id="options-list"></div>
      </div>
    </div>

    <script defer type="module" src="js/main.js"></script>
  </body>
</html>
